name: Source contracts (not Unity runtime)
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install tree-sitter==0.26.0 tree-sitter-c-sharp==0.23.5
      - run: python tools/check_csharp_syntax.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s Tests/Review -v
